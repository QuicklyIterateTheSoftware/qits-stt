# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# One step: build this repo's docker/Dockerfile and publish it under the tag that is the whole
# contract with qits-deployments — <registry>/<repository>/<this repo's name>:<sha>. The step's own
# container only drives the docker CLI; the build and the push happen in the host's daemon
# through the socket this step declares (docker: true), which is also why the native build's
# memory is the daemon's and not this container's. A failed push is a failed step is a FAILED
# run, so the CD announcement (SUCCESS only) keeps implying "the image exists".
#
# A verify step belongs ahead of this one once a JDK build image exists; today the Dockerfile's
# own native stage is the gate.
steps:
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this an early failure would be
      # swallowed by the next command's exit code, and cd is told an image exists that does not
      # (the exact shape of the qits-workspaces IMAGE_MISSING incident). -u makes an unset registry
      # variable stop the step too.
      set -eu
      registry_host="${QITS_REGISTRY%%:*}"

      # The two --secret flags are the fleet's shape for a credential inside a build: the launcher
      # injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET, and a Dockerfile that needs it
      # mounts it on one RUN — never a --build-arg, which is recorded in a pullable image's history.
      # This build needs none: its Maven resolve is reactor-only over public repositories, so there
      # is no `.qits-maven-settings.xml` here and no mount to feed. Both halves are free — buildx
      # ignores a secret no RUN mounts, and a missing env source is NOT an error (measured on buildx
      # v0.36.1, the build runs green with the variable unset).
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-stt:$QITS_CI_SHA"
      docker build \
        --add-host "$registry_host:host-gateway" \
        --build-arg QITS_MAVEN_REPOSITORY_URL="http://$QITS_REGISTRY/artifacts/maven/maven" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of
      # this one Dockerfile do run concurrently, main's and environment/dev's, which is the race
      # that broke the release of 2026-08-11.
