# The application config for qits-stt as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# a context ships DEFAULTS it does not own the deployment of. The forwardauth settings stay in that
# file on purpose; they are the context's contract, not this process's configuration.
#
# Everything here was previously supplied by the monorepo's app shell
# (service/src/main/resources/application.properties, monolith-only), which is why the suite carried
# a private copy in src/test/resources and the packaged app had none.

quarkus.application.name=qits-stt

# The JAX-RS prefix every qits route lives under. Without it POST /api/speech/transcriptions moves
# to /speech/transcriptions and every caller 404s. The suite sets its own copy, so a test run stays
# green either way — which is exactly why this needs to be here and not only there.
quarkus.rest.path=/api

# Audio uploads. The monorepo raised this app-wide and this endpoint inherited it; at the platform
# default a recording of any length is rejected at the HTTP layer before SpeechController is
# entered.
quarkus.http.limits.max-body-size=64M

# --- the API document -------------------------------------------------------------------------
# Served at /q/openapi, with the browsable UI at /q/swagger-ui — both outside quarkus.rest.path.
# always-include because swagger-ui is a dev-mode-only extension by default, and the point of
# packaging these as processes is that each documents its own surface in a real deployment.
quarkus.smallrye-openapi.info-title=qits-stt API
quarkus.swagger-ui.always-include=true

# --- speech ------------------------------------------------------------------------------------
# Where the venv and models live. The code default is the relative `data/speech`, which resolves
# against the process's working directory — fine for a test, wrong for a packaged process whose CWD
# is whatever the container entrypoint happened to be. Pin it to the same absolute location the
# monorepo used.
qits.speech.home=${user.home}/.qits/speech

# NOT set here, deliberately: qits.speech.warmup-on-start. The monorepo shipped it true, but warmup
# bootstraps a venv with `pip install` — network I/O during startup, which turns an offline or
# slow-registry deployment into a failed boot rather than a slow first transcription. Left at the
# code default (false); a deployment that wants the warm start opts in.
